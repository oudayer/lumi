kind: pipeline
type: docker
name: build

clone:
  disable: true

steps:
  - name: clone-repo
    image: nest-pm2-app:latest
    pull: never
    commands:
      - npm install pnpm -g
      - git clone https://github.com/oudayer/lumi.git
      - cd lumi
      - ls
      - pnpm install


trigger:
  branch:
    - main
